<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Skill assessment | CareerAI</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="css/components.css">
	<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-page" data-page="assessment" data-description="Rate your current comfort with each skill. Your answers are self-reported and can be updated by taking the assessment again.">
	<div class="app-layout">
		<aside class="sidebar" id="sidebar-mount"></aside>
		<main class="dashboard-main">
			<header class="page-topbar">
				<div><p class="eyebrow">ASSESS</p><h1>Skill assessment</h1></div>
				<a class="button button-light button-small" href="dashboard.html">Dashboard <span aria-hidden="true">&#8599;</span></a>
			</header>
			<section class="feature-intro">
				<p class="eyebrow">YOUR CURRENT SKILL SNAPSHOT</p>
				<h2>How comfortable are you?</h2>
				<p data-page-description></p>
			</section>
			<section id="feature-content" class="assessment-panel" aria-live="polite">
				<p class="empty-state">Loading assessment questions...</p>
			</section>
			<p id="assessment-status" class="api-status" role="status" aria-live="polite"></p>
		</main>
	</div>
	<script type="module" src="js/assessment.js"></script>
</body>
</html>
